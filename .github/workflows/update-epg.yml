name: Update Cinema One EPG

on:
  schedule:
    # Every day at 12:05 AM Philippines time
    # GitHub uses UTC, so 16:05 UTC = 12:05 AM PHT
    - cron: "5 16 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate EPG
        run: |
          python generate_epg.py

      - name: Commit updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add epg.xml

          git diff --cached --quiet || git commit -m "Update Cinema One EPG"

          git push
